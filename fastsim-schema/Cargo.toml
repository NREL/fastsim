[package]
name = "fastsim-schema"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# TODO: figure out FASTSim licensing
# license = 
description = "Vehicle database schema for the fastsim-vehicles repository"
authors = ["NREL/BEST/CIMS/TETA Group <fastsim@nlr.gov>"]
homepage = "https://www.nlr.gov/transportation/fastsim"
readme = "../README.md"
repository = "https://github.com/NatLabRockies/fastsim"
documentation = "https://natlabrockies.github.io/fastsim/"

[lib]
crate-type = [
    "rlib",
    "cdylib",
] # cdylib is what wasm-bindgen needs to produce a .wasm binary

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
clap = { version = "4.6.5", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
walkdir = { version = "2", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]
build-index = []
cli = ["dep:clap", "dep:anyhow", "dep:walkdir"]

[[bin]]
name = "build-index"
required-features = ["cli"]
