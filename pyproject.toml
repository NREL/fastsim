[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "fastsim"
version = "3.0.6"
authors = [{ name = "NLR/BEST/CIMS/TETA Group", email = "fastsim@nlr.gov" }]
description = "Tool for modeling vehicle powertrains"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10,<3.14"
# requires-python = ">=3.10,<3.15"  # Re-enable when PyO3/maturin supports 3.14 in this project
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pandas>=2.1.2, <=2.3.2",
    "polars~=1.4",
    "matplotlib~=3.3",
    "numpy>=1.18, <=2.3.2",
    "seaborn>=0.11.0,<13.2",
    "typing_extensions~=4.12",
    "PyYAML==6.0.2",
    "msgpack==1.1.0",
    "ipykernel~=6.29",
    "executing~=2.0",
    "pip",
    "types-seaborn~=0.13.2",
]

[project.urls]
Homepage = "https://www.nlr.gov/transportation/fastsim"

[project.optional-dependencies]
# User-facing feature extras only
# NOTE: consider adding this as a user-facing optional feature
# pymoo = [
#     "pymoo~=0.6",
# ]

[dependency-groups]
# Internal groups for development, CI/CD, testing, documentation purposes
build = [
    "maturin~=1.8",
]
test = [
    {include-group = "build"},
    "pytest~=8.3",
    "memory_profiler~=0.61.0",
]
lint = [
    "ruff>=0.11.9",
]
docs = [
    "jupyter-book>=2.0.0",
    "nbformat",
]
dev = [
    {include-group = "build"},
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
    "pylsp-mypy>=0.7.0",
    "pylsp-rope>=0.1.17",
    "python-lsp-server~=1.10",
    "plotly~=6.0",
    "deepdiff>=8.4.2",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = [
    "fastsim*",
] # package names should match these glob patterns (["*"] by default)
namespaces = false # to disable scanning PEP 420 namespaces (true by default)

[tool.maturin]
profile = "release"
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "fastsim.fastsim"
manifest-path = "fastsim-py/Cargo.toml"
include = [
    { format = "sdist", path = "fastsim-core/Cargo.toml" },
    { format = "sdist", path = "fastsim-core/src/*" },
    { format = "sdist", path = "fastsim-py/Cargo.toml" },
    { format = "sdist", path = "fastsim-py/src/*" },
    { format = "sdist", path = "fastsim-core/proc-macros/Cargo.toml" },
    { format = "sdist", path = "fastsim-core/proc-macros/src/*" },
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
fastsim = { path = ".", editable = true }

[tool.pixi.feature.docs.dependencies]
nodejs = "26.4.*"

[tool.pixi.feature.build.dependencies]
rust = ">=1.47.0"

# Python versions for CI/CD testing matrix
# https://devguide.python.org/versions/#status-of-python-versions
[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
# [tool.pixi.feature.py314.dependencies]
# python = "3.14.*"

[tool.pixi.environments]
default = { solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
test = { features = ["test", "build"], solve-group = "default" }
lint = { features = ["lint"], solve-group = "default" }
docs = { features = ["docs", "build"], solve-group = "default" }
dev = { features = ["dev", "docs", "build"], solve-group = "default" }
# Environments for specific Python versions with CI/CD
# https://devguide.python.org/versions/#status-of-python-versions
py310 = { features = ["py310", "test"], solve-group = "py310" }
py311 = { features = ["py311", "test"], solve-group = "py311" }
py312 = { features = ["py312", "test"], solve-group = "py312" }
py313 = { features = ["py313", "test"], solve-group = "py313" }
# py314 = { features = ["py314", "test"], solve-group = "py314" }

[tool.pixi.tasks]
cargo_test = "cargo test --release"
py_build = "maturin develop --release"
py_test = { cmd = "pixi run -e test pytest -v", depends-on = ["py_build"] }
build_and_test = { depends-on = ["cargo_test", "py_test"] }
docs = { cmd = "python demos_to_notebooks.py && jupyter book start --execute", cwd = "docs", default-environment = "docs" }
fmt = "ruff format"
lint = "pylint"
style = { depends-on = ["fmt", "lint"] }

[tool.ruff]
# Specify Python version
target-version = "py311"
# Maximum line length
line-length = 100
# Exclude specific paths
exclude = [
    "site-packages", # Ignore all errors in site-packages
]

[tool.ruff.lint.isort]
known-first-party = ["fastsim"]
section-order = [
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
preview = true
select = [
    "A",   # flake8-builtins
    "ARG", # flake8-unused-arguments
    # "B", # flake8-bugbear
    "C",    # Pylint: Convention
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "COM",  # flake8-commas
    "D",    # pydocstyle
    "E",    # Error
    "F",    # Pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "NPY",  # numpy-specific
    "PERF", # Perflint
    # "PL", # Pylint
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    # "TID", # flake8-tidy-imports (absolute imports)
    "UP", # pyupgrade
    "W",  # Warning
]
ignore = [
    "D400", # first-line-should-end-with-a-period
    "E266", # Too many leading `#`
    "D205", # blank line after summary
    "N807",
]

# [tool.ruff.lint.pydocstyle]
# convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# https://mypy.readthedocs.io/en/stable/config_file.html
# https://mypy.readthedocs.io/en/stable/config_file.html#example-pyproject-toml
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
allow_redefinition = true
exclude = [
    # '^file1\.py$',  # TOML literal string (single-quotes, no escaping necessary)
    # "^file2\\.py$",  # TOML basic string (double-quotes, backslash and other characters need escaping)
]

# mypy per-module options:

# [[tool.mypy.overrides]]
# module = "mycode.foo.*"
# disallow_untyped_defs = true

# [[tool.mypy.overrides]]
# module = "mycode.bar"
# warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "pymoo.*",
    "fastsim.*", # TODO: fix fastsim and remove this line
]
ignore_missing_imports = true
