[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "fastsim"
version = "3.1.0"
authors = [{ name = "NLR/BEST/CIMS/TETA Group", email = "fastsim@nlr.gov" }]
description = "Tool for modeling vehicle powertrains"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pandas>=2.1.2",
    "polars~=1.4",
    "plotly~=6.0",
    "numpy>=1.18",
    "typing_extensions~=4.12",
    "PyYAML>=6.0",
    "msgpack>=1.2.1",
]

[project.urls]
Homepage = "https://www.nlr.gov/transportation/fastsim"

[project.optional-dependencies]
# User-facing feature extras only
# NOTE: consider adding this as a user-facing optional feature
# pymoo = [
#     "pymoo~=0.6",
# ]

[dependency-groups]
# Internal groups for development, CI/CD, testing, documentation purposes
build = ["maturin~=1.8"]
test = [
    { include-group = "build" },
    "ruff>=0.11.9",
    "pytest>=9.1",
    "memory_profiler>=0.61",
    "nbformat>=4.2.0",
    "nbmake",
    "pytest-xdist",
    "matplotlib~=3.3",
    "ipykernel~=6.29",
    "executing~=2.0",
]
docs = ["jupyter-book>=2.0.0", "nbformat>=4.2.0"]
dev = [
    { include-group = "build" },
    { include-group = "test" },
    { include-group = "docs" },
    "pylsp-mypy>=0.7.0",
    "pylsp-rope>=0.1.17",
    "python-lsp-server~=1.10",
    "deepdiff>=8.4.2",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = [
    "fastsim*",
] # package names should match these glob patterns (["*"] by default)
namespaces = false # to disable scanning PEP 420 namespaces (true by default)

[tool.maturin]
profile = "release"
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "fastsim.fastsim"
manifest-path = "fastsim-py/Cargo.toml"
include = [
    { format = "sdist", path = "NOTICE" },
    { format = "sdist", path = "fastsim-core/Cargo.toml" },
    { format = "sdist", path = "fastsim-core/src/*" },
    { format = "sdist", path = "fastsim-py/Cargo.toml" },
    { format = "sdist", path = "fastsim-py/src/*" },
    { format = "sdist", path = "fastsim-core/fastsim-proc-macros/Cargo.toml" },
    { format = "sdist", path = "fastsim-core/fastsim-proc-macros/src/*" },
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
fastsim = { path = ".", editable = true }

[tool.pixi.feature.docs.dependencies]
nodejs = "26.4.*"

[tool.pixi.feature.build.dependencies]
rust = ">=1.47.0"
zlib = "*"
openssl = "*"
libcurl = "*"
pkg-config = "*"
uv = "*"
just = "*"

[tool.pixi.feature.wasm.dependencies]
rust-std-wasm32-unknown-unknown = "*"
nodejs = "26.4.*"  # for `wasm-pack test --node`; version matches the docs feature

# Explicit release marker — redundant with [tool.maturin] profile = "release" but
# makes the intent unambiguous per environment.
[tool.pixi.feature.profile-release.activation.env]
MATURIN_PEP517_ARGS = "--profile release"

# Override the [tool.maturin] profile = "release" default for environments where
# fast rebuilds matter more than runtime performance. Only needed for dev.
[tool.pixi.feature.profile-debug.activation.env]
MATURIN_PEP517_ARGS = "--profile dev"

[tool.pixi.environments]
# Install from source: optimized for runtime performance.
default = { features = ["build", "profile-release"], solve-group = "default" }
# CI: rust checks + python tests. Debug profile favors compile speed; cibw handles release wheels.
build = { features = [
    "build",
    "test",
    "profile-debug",
], solve-group = "default" }
# Docs: debug profile is fine for now; switch to profile-release if notebooks
# include performance benchmarks or run-time demonstrations.
docs = { features = [
    "docs",
    "build",
    "profile-debug",
], solve-group = "default" }
# WASM artifact for fastsim-schema. wasm-pack controls optimization via task flags.
wasm = { features = ["wasm", "build"], solve-group = "default" }
# Day-to-day iteration (direnv default): debug profile on env install/rebuild.
dev = { features = [
    "dev",
    "build",
    "test",
    "docs",
    "wasm",
    "profile-debug",
], solve-group = "default" }

[tool.pixi.tasks]
# Full local dev-loop check. Source of truth lives in justfile.
check = { cmd = "just check", default-environment = "build" }
rust-check = { cmd = "just rust-check", default-environment = "build" }

# Check consistency of versions across project
check-versions = { cmd = "just check-versions", default-environment = "build" }
# Debug build/install flow is defined in justfile.
py-build = { cmd = "just py-build", default-environment = "build" }
# Release build/install flow is defined in justfile.
py-build-release = { cmd = "just py-build-release", default-environment = "build" }
# Python tests (including nbmake notebook testing), runs serially
py-test = { cmd = "just py-test", default-environment = "build" }
# Python tests (including nbmake notebook testing), runs in parallel using pytest-xdist
py-test-xdist = { cmd = "just py-test-xdist", default-environment = "build" }

docs = { cmd = "just docs", default-environment = "dev" }
build-docs = { cmd = "just build-docs", default-environment = "dev" }

# One-time (or version-bump-triggered) setup: installs wasm-pack + a
# version-matched wasm-bindgen-cli. Not conda-installable as far as could be
# confirmed, so these go through cargo install inside the wasm env instead.
wasm-setup = "cargo install wasm-pack wasm-bindgen-cli --locked"
# Sanity check that wasm-bindgen (Cargo.toml) and wasm-bindgen-cli (installed
# via wasm-setup) agree — mismatches are the single most common wasm-pack
# failure and are otherwise a confusing error to debug blind.
wasm-check-versions = { cmd = """
  cargo tree -p fastsim-schema --features wasm -i wasm-bindgen | head -n 1
  wasm-bindgen --version
""" }
# Verifies fastsim-schema actually compiles for wasm32-unknown-unknown and
# its wasm_bindgen_test suite passes. Cheap — no fastsim-core dependency,
# single small crate — safe to run on every relevant PR.
wasm-test = "wasm-pack test --node fastsim-schema --no-default-features --features wasm"
# Produces the actual pkg/ output (wasm binary + JS glue) for local
# inspection/manual embedding tests. Not wired to any publish step yet.
wasm-build = "wasm-pack build fastsim-schema --target web --out-dir pkg -- --no-default-features --features wasm"

# fmt = "ruff format"
# lint = "pylint"
# style = { depends-on = ["fmt", "lint"] }

[tool.pytest.ini_options]
# Pytest configuration for running notebook tests with nbmake and parallel execution
addopts = "--nbmake --nbmake-timeout=600"
filterwarnings = [
    # memory_profiler 0.61.0 uses deprecated asyncio.iscoroutinefunction (fixed in a future release)
    "ignore::DeprecationWarning:memory_profiler",
]

[tool.ruff]
# Specify Python version
target-version = "py311"
# Maximum line length
line-length = 100
# Exclude specific paths
exclude = [
    "site-packages", # Ignore all errors in site-packages
]

[tool.ruff.lint.isort]
known-first-party = ["fastsim"]
section-order = [
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
preview = true
select = [
    "A",   # flake8-builtins
    "ARG", # flake8-unused-arguments
    # "B", # flake8-bugbear
    "C",    # Pylint: Convention
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "COM",  # flake8-commas
    "D",    # pydocstyle
    "E",    # Error
    "F",    # Pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "NPY",  # numpy-specific
    "PERF", # Perflint
    # "PL", # Pylint
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    # "TID", # flake8-tidy-imports (absolute imports)
    "UP", # pyupgrade
    "W",  # Warning
]
ignore = [
    "D400", # first-line-should-end-with-a-period
    "E266", # Too many leading `#`
    "D205", # blank line after summary
    "N807",
]

# [tool.ruff.lint.pydocstyle]
# convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# https://mypy.readthedocs.io/en/stable/config_file.html
# https://mypy.readthedocs.io/en/stable/config_file.html#example-pyproject-toml
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
allow_redefinition = true
exclude = [
    # '^file1\.py$',  # TOML literal string (single-quotes, no escaping necessary)
    # "^file2\\.py$",  # TOML basic string (double-quotes, backslash and other characters need escaping)
]

# mypy per-module options:

# [[tool.mypy.overrides]]
# module = "mycode.foo.*"
# disallow_untyped_defs = true

# [[tool.mypy.overrides]]
# module = "mycode.bar"
# warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "pymoo.*",
    "fastsim.*", # TODO: fix fastsim and remove this line
]
ignore_missing_imports = true
