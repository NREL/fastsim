[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "fastsim"
version = "3.1.0"
authors = [{ name = "NLR/BEST/CIMS/TETA Group", email = "fastsim@nlr.gov" }]
description = "Tool for modeling vehicle powertrains"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pandas>=2.1.2, <=2.3.2",
    "polars~=1.4",
    "matplotlib~=3.3",
    "plotly~=6.0",
    "numpy>=1.18, <=2.3.2",
    "seaborn>=0.11.0,<13.2",
    "typing_extensions~=4.12",
    "PyYAML==6.0.2",
    "msgpack==1.2.1",
    "ipykernel~=6.29",
    "executing~=2.0",
    "pip",
    "types-seaborn~=0.13.2",
]

[project.urls]
Homepage = "https://www.nlr.gov/transportation/fastsim"

[project.optional-dependencies]
# User-facing feature extras only
# NOTE: consider adding this as a user-facing optional feature
# pymoo = [
#     "pymoo~=0.6",
# ]

[dependency-groups]
# Internal groups for development, CI/CD, testing, documentation purposes
build = ["maturin~=1.8"]
test = [
    { include-group = "build" },
    "ruff>=0.11.9",
    "pytest>=9.1,<10.0",
    "memory_profiler~=0.61.0",
    "nbformat>=4.2.0",
    "nbmake",
    "pytest-xdist",
]
docs = ["jupyter-book>=2.0.0", "nbformat>=4.2.0"]
dev = [
    { include-group = "build" },
    { include-group = "test" },
    { include-group = "docs" },
    "pylsp-mypy>=0.7.0",
    "pylsp-rope>=0.1.17",
    "python-lsp-server~=1.10",
    "deepdiff>=8.4.2",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = [
    "fastsim*",
] # package names should match these glob patterns (["*"] by default)
namespaces = false # to disable scanning PEP 420 namespaces (true by default)

[tool.maturin]
profile = "release"
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "fastsim.fastsim"
manifest-path = "fastsim-py/Cargo.toml"
include = [
    { format = "sdist", path = "fastsim-core/Cargo.toml" },
    { format = "sdist", path = "fastsim-core/src/*" },
    { format = "sdist", path = "fastsim-py/Cargo.toml" },
    { format = "sdist", path = "fastsim-py/src/*" },
    { format = "sdist", path = "fastsim-core/proc-macros/Cargo.toml" },
    { format = "sdist", path = "fastsim-core/proc-macros/src/*" },
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
fastsim = { path = ".", editable = true }

[tool.pixi.feature.docs.dependencies]
nodejs = "26.4.*"

[tool.pixi.feature.build.dependencies]
rust = ">=1.47.0"
zlib = "*"

# Prevent C23 mode in the conda cross-compiler so that vendored OpenSSL (from
# curl/isahc static-ssl) does not reference __isoc23_strtol, a glibc 2.38+
# symbol absent from the conda sysroot.
[tool.pixi.feature.build.activation.env]
CFLAGS = "-std=gnu11"

# Explicit release marker — redundant with [tool.maturin] profile = "release" but
# makes the intent unambiguous per environment.
[tool.pixi.feature.profile-release.activation.env]
MATURIN_PEP517_ARGS = "--profile release"

# Override the [tool.maturin] profile = "release" default for environments where
# fast rebuilds matter more than runtime performance. Only needed for dev.
[tool.pixi.feature.profile-debug.activation.env]
MATURIN_PEP517_ARGS = "--profile dev"

[tool.pixi.environments]
# Install from source: optimized for runtime performance.
default = { features = ["build", "profile-release"], solve-group = "default" }
# CI: rust checks + python tests. Debug profile favors compile speed; cibw handles release wheels.
build = { features = [
    "build",
    "test",
    "profile-debug",
], solve-group = "default" }
# Docs: notebooks execute against release fastsim for accurate performance output.
docs = { features = [
    "docs",
    "build",
    "profile-release",
], solve-group = "default" }
# Day-to-day iteration (direnv default): debug profile on env install/rebuild.
dev = { features = [
    "dev",
    "build",
    "test",
    "docs",
    "profile-debug",
], solve-group = "default" }

[tool.pixi.tasks]
# Full local dev-loop check: replaces build_and_test.sh.
check = { depends-on = [
    "check-versions",
    "rust-check",
    "py-build-dev",
    "py-test",
] }
rust-check = "cargo fmt --check && cargo test --release"

# Check consistency of versions across project
check-versions = "python python/fastsim/check_versions.py"
# Release build: use for local performance checks.
py-build = "maturin develop --release"
# Debug build: flag is explicit because [tool.maturin] profile is read by maturin develop directly.
py-build-dev = "maturin develop --profile dev"
# Runs pytest in the build env.
py-test = { cmd = "pixi run -e build pytest -v" }

docs = { cmd = "jupyter book start --execute", cwd = "docs", default-environment = "dev" }
build-docs = { cmd = "jupyter book build --strict --html --execute", cwd = "docs", default-environment = "dev" }

# fmt = "ruff format"
# lint = "pylint"
# style = { depends-on = ["fmt", "lint"] }

[tool.pytest.ini_options]
# Pytest configuration for running notebook tests with nbmake and parallel execution
addopts = "--nbmake --nbmake-timeout=600"
filterwarnings = [
    # memory_profiler 0.61.0 uses deprecated asyncio.iscoroutinefunction (fixed in a future release)
    "ignore::DeprecationWarning:memory_profiler",
]

[tool.ruff]
# Specify Python version
target-version = "py311"
# Maximum line length
line-length = 100
# Exclude specific paths
exclude = [
    "site-packages", # Ignore all errors in site-packages
]

[tool.ruff.lint.isort]
known-first-party = ["fastsim"]
section-order = [
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
preview = true
select = [
    "A",   # flake8-builtins
    "ARG", # flake8-unused-arguments
    # "B", # flake8-bugbear
    "C",    # Pylint: Convention
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "COM",  # flake8-commas
    "D",    # pydocstyle
    "E",    # Error
    "F",    # Pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "NPY",  # numpy-specific
    "PERF", # Perflint
    # "PL", # Pylint
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    # "TID", # flake8-tidy-imports (absolute imports)
    "UP", # pyupgrade
    "W",  # Warning
]
ignore = [
    "D400", # first-line-should-end-with-a-period
    "E266", # Too many leading `#`
    "D205", # blank line after summary
    "N807",
]

# [tool.ruff.lint.pydocstyle]
# convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# https://mypy.readthedocs.io/en/stable/config_file.html
# https://mypy.readthedocs.io/en/stable/config_file.html#example-pyproject-toml
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
allow_redefinition = true
exclude = [
    # '^file1\.py$',  # TOML literal string (single-quotes, no escaping necessary)
    # "^file2\\.py$",  # TOML basic string (double-quotes, backslash and other characters need escaping)
]

# mypy per-module options:

# [[tool.mypy.overrides]]
# module = "mycode.foo.*"
# disallow_untyped_defs = true

# [[tool.mypy.overrides]]
# module = "mycode.bar"
# warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "pymoo.*",
    "fastsim.*", # TODO: fix fastsim and remove this line
]
ignore_missing_imports = true
