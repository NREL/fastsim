[workspace]

members = [
    "fastsim-core",                     # pure rust core with optional pyo3 feature
    "fastsim-core/fastsim-proc-macros",
    "fastsim-py",                       # python module exposing fastsim-core
    "fastsim-cli",                      # command line interface for fastsim-core
    "fastsim-vehicle-schema",           # schema for vehicle databases
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.83"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[workspace.dependencies]
document-features = "0.2.10"
fastsim-core = { path = "fastsim-core" }
fastsim-vehicle-schema = { path = "fastsim-vehicle-schema" }
anyhow = "1.0.71"
serde = { version = "1.0.136", features = ["derive"] }
pyo3 = "0.29.0"
thiserror = "2.0.11"
uom = { version = "0.35.0", features = ["use_serde"] }
ninterp = { version = "0.7.3", features = ["serde"] }
fastsim-2 = { package = "fastsim-core", version = "0.1.11", features = [
    "resources",
] }
lazy_static = "1.4.0"
