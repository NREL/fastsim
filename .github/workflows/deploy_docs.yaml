name: Deploy Jupyter Book site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["fastsim-3"]
    paths:
      - "docs/**"
      - ".github/workflows/deploy_docs.yaml"
      - "README.md"
      - "python/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Jupyter Book and other dependencies
        run: |
          pip install -U pip
          pip install -r docs/requirements.txt

      - name: Generate Python docs
        working-directory: ${{runner.workspace}}/fastsim/
        run: pydoc-markdown -I python/ --render-toc > docs/content/python-doc.md

      - name: Convert demos to notebooks
        working-directory: ${{runner.workspace}}/fastsim/
        run: python docs/demos_to_notebooks.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3

      - name: Build with Jupyter Book
        working-directory: ${{runner.workspace}}/fastsim/docs/
        # TODO: fix errors to allow strict build
        # run: jupyter book build --html --strict
        run: jupyter book build --html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_build/html

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
