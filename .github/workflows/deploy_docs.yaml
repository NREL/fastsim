name: Deploy Jupyter Book site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["fastsim-3"]
    paths:
      - "docs/**"
      - ".github/workflows/deploy_docs.yaml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pixi run -e docs bash -e {0}
    env:
      # Disable HTTP/2 multiplexing to avoid intermittent crates.io download failures
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.14
        with:
          environments: docs

      # Register the python3 kernel that the generated notebooks request.
      - name: Register Jupyter kernel
        run: python -m ipykernel install --user --name python3

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jupyter Book
        working-directory: docs
        # GitHub Pages serves this project site under /<repo>, so MyST needs the
        # base path to build correct links to its static assets.
        env:
          BASE_URL: "/${{ github.event.repository.name }}"
        run: jupyter book build --strict --html --execute

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_build/html

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
