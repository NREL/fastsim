name: Deploy Jupyter Book site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["fastsim-3"]
    paths:
      - "docs/**"
      - ".github/workflows/deploy_docs.yaml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache the cargo registry and compiled Rust artifacts so docs deploys
      # don't recompile the core from scratch every run.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # FASTSim must be importable so the demo notebooks can be executed during
      # the build. This compiles the Rust core, so it is the slow step.
      - name: Install FASTSim and doc dependencies
        run: |
          pip install -U pip
          pip install .
          pip install -r docs/requirements.txt

      # Register the python3 kernel that the generated notebooks request.
      - name: Register Jupyter kernel
        run: python -m ipykernel install --user --name python3

      - name: Convert demos to notebooks
        run: python docs/demos_to_notebooks.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jupyter Book
        working-directory: docs
        # TODO: consider adding --strict once a strict + execute build is
        # confirmed clean, so broken links/refs and execution errors fail the
        # deploy instead of silently publishing.
        run: jupyter book build --html --execute

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_build/html

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
