name: Build wheels and run tests

on: [push, workflow_call]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-checks:
    name: Lint, test, and build wasm (Linux-only checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: build wasm

      - name: Check version consistency
        run: pixi run -e build python python/fastsim/check_versions.py

      # - name: Check Python formatting & linting
      #   run: pixi run -e build ruff check .

      - name: Check Rust formatting
        run: pixi run -e build cargo fmt --check

      - name: Install cargo-hack
        run: pixi run -e build cargo install cargo-hack --locked

      # - name: Check Rust linting
      #   run: pixi run -e test cargo clippy -- -D warnings

      - name: Run Rust tests
        run: pixi run -e build cargo test --workspace --all-features --release

      - name: Check each feature
        run: pixi run -e build cargo hack check -p fastsim-core --each-feature

      - name: Install wasm-pack and wasm-bindgen-cli
        run: pixi run -e wasm wasm_setup

      - name: Verify wasm-bindgen crate and CLI versions match
        run: |
          CRATE_VERSION=$(pixi run -e wasm cargo tree -p fastsim-schema --features wasm -i wasm-bindgen | head -n 1 | awk '{print $2}' | tr -d 'v')
          CLI_VERSION=$(pixi run -e wasm wasm-bindgen --version | awk '{print $2}')
          echo "fastsim-schema depends on wasm-bindgen $CRATE_VERSION; installed wasm-bindgen-cli is $CLI_VERSION"
          if [ "$CRATE_VERSION" != "$CLI_VERSION" ]; then
            echo "::error::wasm-bindgen version mismatch: crate=$CRATE_VERSION cli=$CLI_VERSION."
            exit 1
          fi

      - name: Run wasm tests
        run: pixi run -e wasm wasm_test

      - name: Build wasm package
        run: pixi run -e wasm wasm_build

  build-and-test-wheels:
    name: Build and test wheels on ${{ matrix.platform || matrix.os.base }}-${{ matrix.os.version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - base: ubuntu
            version: latest
          - base: macos
            version: "15-intel"
            arch: "x86_64"
          - base: macos
            version: "latest"
            arch: "arm64"
          - base: windows
            version: latest
            arch: "amd64"
        include:
          - os:
              base: ubuntu
              version: latest
            platform: linux
          - os:
              base: windows
              version: latest
            ls: dir
    runs-on: ${{ format('{0}-{1}', matrix.os.base, matrix.os.version) }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wheel build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group wheels

      - name: Build source distribution
        if: matrix.os.base == 'ubuntu'
        run: |
          python -m build --sdist --outdir dist

      # Widens wheel compatibility on the Intel Mac runner, which otherwise
      # defaults to a higher minimum macOS version than we want to require.
      - name: Update minimum supported MacOS for Wheels for MacOS 15-intel (Intel Mac)
        if: matrix.os.base == 'macos' && matrix.os.version == '15-intel'
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.12" >> $GITHUB_ENV

      # NOTE: parts inspired by https://cibuildwheel.pypa.io/en/stable/setup/
      # One invocation per platform builds every target Python version --
      # cibuildwheel manages fetching/using each target interpreter internally.
      - name: Build ${{ matrix.platform || matrix.os.base }} binaries
        run: python -m cibuildwheel --output-dir dist
        env:
          # Python version targets
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-musllinux* *i686 *ppc64le *s390x *aarch64"
          CIBW_PLATFORM: ${{ matrix.platform || matrix.os.base }}
          CIBW_BEFORE_TEST: python -m pip install --group test
          CIBW_TEST_COMMAND: "pytest -v -n 1 {project}"
          CIBW_ARCHS_MACOS: "${{ matrix.os.arch }}"
          CIBW_ENVIRONMENT: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_ENVIRONMENT_WINDOWS: 'PATH="$UserProfile\.cargo\bin;$PATH"'
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_BUILD: rustup show
          # Linux builds run in an isolated container with no Rust preinstalled,
          # so it needs its own toolchain install.
          CIBW_BEFORE_BUILD_LINUX: >
            yum -y install openssl openssl-devel perl perl-IPC-Cmd &&
            curl https://sh.rustup.rs -sSf | sh -s -- --profile=minimal -y &&
            rustup show

      - name: List dist files
        run: ${{ matrix.ls || 'ls -lh' }} dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fastsim-${{ matrix.platform || matrix.os.base }}-${{ matrix.os.version }}-${{ strategy.job-index }}
          path: ./dist/*
