name: Reusable build + test + wheel matrix to call from multiple workflows

on:
  workflow_call:

jobs:
  python-versions:
    name: Set target Python versions
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.set.outputs.python-versions }}
      cibw-build: ${{ steps.set.outputs.cibw-build }}
    steps:
      - id: set
        # https://devguide.python.org/versions/#status-of-python-versions
        # Single source of truth for target Python versions in CI/CD
        run: |
          versions='["10","11","12","13","14"]'
          echo "python-versions=$versions" >> "$GITHUB_OUTPUT"
          cibw_build=$(echo "$versions" | jq -r '[.[] | "cp3" + . + "-*"] | join(" ")')
          echo "cibw-build=$cibw_build" >> "$GITHUB_OUTPUT"

  test:
    name: Test py3.${{ matrix.python-version }} on ${{ matrix.platform || matrix.os.base }}-${{ matrix.os.version }}
    needs: python-versions
    strategy:
      fail-fast: true
      matrix:
        os:
          - base: ubuntu
            version: latest
          - base: macos
            version: "15-intel"
            arch: "x86_64"
          - base: macos
            version: "latest"
            arch: "arm64"
          - base: windows
            version: latest
            arch: "amd64"
        python-version: ${{ fromJson(needs.python-versions.outputs.python-versions) }}
        include:
          - os:
              base: ubuntu
              version: latest
            platform: linux
          - os:
              base: windows
              version: latest
            ls: dir
    runs-on: ${{ format('{0}-{1}', matrix.os.base, matrix.os.version) }}
    defaults:
      run:
        shell: pixi run -e py3${{ matrix.python-version }} bash -e {0}
    env:
      # Disable HTTP/2 multiplexing to avoid intermittent crates.io download failures
      CARGO_HTTP_MULTIPLEXING: "false"
      FASTSIM_DISABLE_NETWORK_TESTS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.14
        with:
          environments: py3${{ matrix.python-version }}

      - name: Check version consistency
        if: matrix.os.base == 'ubuntu' && matrix.python-version == '11'
        run: python python/fastsim/check_versions.py

      # - name: Check Python formatting
      #   run: ruff check .

      - name: Check Rust formatting
        run: cargo fmt --check

      # - name: Check Rust linting
      #   run: cargo clippy -- -D warnings

      - name: Run Rust tests
        run: cargo test --release

      - name: Run Python tests
        timeout-minutes: 20
        run: pytest -v

  build-wheels:
    name: Build wheels on ${{ matrix.platform || matrix.os.base }}-${{ matrix.os.version }}
    needs: [python-versions, test]
    strategy:
      fail-fast: false
      matrix:
        os:
          - base: ubuntu
            version: latest
          - base: macos
            version: "15-intel"
            arch: "x86_64"
          - base: macos
            version: "latest"
            arch: "arm64"
          - base: windows
            version: latest
            arch: "amd64"
        include:
          - os:
              base: ubuntu
              version: latest
            platform: linux
          - os:
              base: windows
              version: latest
            ls: dir
    runs-on: ${{ format('{0}-{1}', matrix.os.base, matrix.os.version) }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@v4

      # macOS/Windows builds run directly on the host runner (not containerized),
      # so this is the toolchain cibuildwheel's CIBW_BEFORE_BUILD relies on.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        if: matrix.os.base != 'ubuntu'

      # cibuildwheel itself needs a recent Python to run under (it supports
      # only its last three releases) -- this is separate from the Python
      # versions it targets when building wheels, controlled by CIBW_BUILD below.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      # Widens wheel compatibility on the Intel Mac runner, which otherwise
      # defaults to a higher minimum macOS version than we want to require.
      - name: Update minimum supported MacOS for Wheels for MacOS 15-intel (Intel Mac)
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.12" >> $GITHUB_ENV
        if: matrix.os.base == 'macos' && matrix.os.version == '15-intel'

      # sdist is arch/version-independent, so we only need to build it once,
      # on a single arbitrary platform leg (ubuntu).
      - name: Build source distribution
        if: matrix.os.base == 'ubuntu'
        run: |
          python -m pip install setuptools
          python -c "import setuptools; setuptools.setup()" sdist

      # NOTE: parts inspired by https://cibuildwheel.pypa.io/en/stable/setup/
      # One invocation per platform builds every target Python version --
      # cibuildwheel manages fetching/using each target interpreter internally.
      - name: Build ${{ matrix.platform || matrix.os.base }} binaries
        run: cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: ${{ needs.versions.outputs.cibw-build }}
          CIBW_SKIP: "*-win32 *-musllinux* *i686 *ppc64le *s390x *aarch64"
          CIBW_PLATFORM: ${{ matrix.platform || matrix.os.base }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest -v {project}"
          CIBW_ARCHS_MACOS: "${{ matrix.os.arch }}"
          CIBW_ENVIRONMENT: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_ENVIRONMENT_WINDOWS: 'PATH="$UserProfile\.cargo\bin;$PATH"'
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_BUILD: rustup show
          # Linux builds run in an isolated container with no Rust preinstalled,
          # so it needs its own toolchain install.
          CIBW_BEFORE_BUILD_LINUX: >
            curl https://sh.rustup.rs -sSf | sh -s -- --profile=minimal -y &&
            rustup show

      - name: List dist files
        run: ${{ matrix.ls || 'ls -lh' }} dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fastsim-${{ matrix.platform || matrix.os.base }}-${{ matrix.os.version }}-${{ strategy.job-index }}
          path: ./dist/*
