[package]
name = "fastsim-core"
version = "3.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = "Apache-2.0"
description = "Rust backend for the FASTSim vehicle simulation library"
exclude = ["build.rs"]
authors = ["NREL/BEST/CIMS/TETA Group <fastsim@nlr.gov>"]
homepage = "https://www.nlr.gov/transportation/fastsim"
readme = "../README.md"
repository = "https://github.com/NatLabRockies/fastsim"
documentation = "https://natlabrockies.github.io/fastsim/"

[dependencies]
fastsim-proc-macros = { path = "fastsim-proc-macros", version = "3.1.0" }
fastsim-2 = { package = "fastsim-core", version = "0.1.11", optional = true, features = [
    "resources",
] }
fastsim-schema = { workspace = true }
csv = { version = "1.1.6", optional = true }
serde = { workspace = true }
rmp-serde = { version = "1.3.0", optional = true }
serde_yaml = { version = "0.8.23", optional = true }
serde_json = { version = "1.0", optional = true }
uom = { workspace = true }
paste = "1.0.7"
easy-ext = "1.0.0"
rayon = "1.5.3"
document-features = { workspace = true }
anyhow = { workspace = true }
home = "0.5.9"
readonly = "0.2.3"
duplicate = "0.4.1"
nohash-hasher = "0.2.0"
eng_fmt = "0.1.2"
pyo3 = { workspace = true, features = [
    "extension-module",
    "anyhow",
], optional = true }
serde-this-or-that = "0.4.2"
project-root = "0.2.2"
include_dir = { version = "0.7.3", optional = true }
itertools = "0.12.0"
lazy_static = { workspace = true }
regex = "1.10.3"
ndarray = { version = "0.16.1", features = ["serde"] }
toml = { version = "0.8.12", optional = true }
derive_more = { version = "1.0.0", features = [
    "from_str",
    "from",
    "is_variant",
    "try_into",
    "display",
] }
ureq = { version = "2.9.1", optional = true }
url = { version = "2.5.0", optional = true }
ninterp = { workspace = true }
approx = "0.5.1"
thiserror = { workspace = true }
typenum = "1.18.0"
num-traits = "0.2.19"
semver = { version = "1.0.28", features = ["serde"] }
## curl/isahc: optional deps for the compat feature.
## On macOS, static-ssl bundles OpenSSL so pkg-config isn't needed during
## `pixi install` (before conda activation). On Linux, system/conda OpenSSL
## is used instead to avoid the __isoc23_strtol glibc 2.38+ linking error
## that occurs when the conda cross-compiler compiles vendored OpenSSL.
curl = { version = "0.4", optional = true }
isahc = { version = "1.7", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
curl = { version = "0.4", features = ["static-ssl"], optional = true }
isahc = { version = "1.7", features = ["static-ssl"], optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json = "1.0"

[features]
default = ["resources", "serde-default", "simdrivelabel"]
## Enables conversion functions from FASTSim 2 data structures
compat = ["dep:fastsim-2", "dep:curl", "dep:isahc", "dep:include_dir"]
## Enables `pyo3` to provide fastsim-3 structs, methods, and functions to Python
pyo3 = ["dep:pyo3"]
## Compiles external resources (e.g. vehicle files or cycle files) to be
## available in the binary
resources = ["dep:include_dir"]
## Enables internet-querying dependencies
web = ["dep:ureq", "dep:url"]
## Enables several text file formats for serialization and deserialization
serde-default = ["csv", "json", "toml", "yaml", "msgpack"]
## Enables csv serialization and deserialization
csv = ["dep:csv"]
## Enables json serialization and deserialization
json = ["dep:serde_json"]
## Enables toml serialization and deserialization
toml = ["dep:toml"]
## Enables yaml serialization and deserialization
yaml = ["dep:serde_yaml"]
## Enables message pack serialization and deserialization via `rmp-serde`
msgpack = ["dep:rmp-serde"]

## Enables the simdrivelabel module for calculating EPA label fuel economy
simdrivelabel = ["resources", "yaml", "json", "csv"]

#! ### Features needed to allow for custom `uom` quantities and units.  These
#! ### have no actual effect.
si = []
f32 = []
cargo-clippy = []

## Activates `timer` macros
timer = []
